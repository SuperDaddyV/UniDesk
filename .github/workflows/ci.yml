name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore UniDesk.sln -r win-x64 --locked-mode
      - name: Audit dependencies
        shell: pwsh
        run: ./scripts/Test-PackageVulnerabilities.ps1
      - name: Check release metadata
        shell: pwsh
        run: ./scripts/Test-VersionConsistency.ps1
      - name: Build
        run: dotnet build UniDesk.sln -c Release --no-restore
      - name: Test
        run: dotnet test UniDesk.sln -c Release --no-build
