name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore UniDesk.sln
      - name: Audit dependencies
        shell: pwsh
        run: ./scripts/Test-PackageVulnerabilities.ps1
      - name: Check release metadata
        shell: pwsh
        run: ./scripts/Test-VersionConsistency.ps1
      - name: Build
        run: dotnet build UniDesk.sln -c Release --no-restore
      - name: Test
        run: dotnet test UniDesk.sln -c Release --no-build
